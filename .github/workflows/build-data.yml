# Merge Apps Script inbox drops into data/ and attach Kobo / 博客來 / 讀墨 / Goodreads / Amazon ratings.
# Pushes made with GITHUB_TOKEN do not re-trigger workflows, so there is no loop.
name: build-data

on:
  push:
    branches: [main]
    paths: ["data/**"]
  schedule:
    - cron: "0 4 * * 3"   # Wed 12:00 Taipei: retry anything blocked/not found earlier in the week
  workflow_dispatch:
    inputs:
      refresh:
        description: "Ignore cached ratings and look every book up again"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Merge inbox
        run: python3 src/build_data.py

      - name: Fetch ratings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_INPUT_TPM: ${{ vars.CLAUDE_INPUT_TPM }}  # optional; default 400000 (80% of 500k/min)
          ENRICH_REFRESH: ${{ inputs.refresh }}
          ENRICH_TIME_BUDGET_MINUTES: "40"
          PYTHONUNBUFFERED: "1"  # show progress live, and keep it if the step is cut short
        run: python3 src/enrich.py

      - name: Commit data
        if: always()  # keep whatever ratings were saved, even after a timeout or failure
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: merge inbox + ratings"
          git pull --rebase origin main
          git push origin main
