<h1>Kobo 書單擷取（Brave）</h1>
<p><a class="bm" href="javascript:(()%20=&gt;%20{%20const%20text%20=%20(el)%20=&gt;%20(el%20?%20el.textContent.replace(/%5Cs+/g,%20&#x27;%20&#x27;).trim()%20:%20&#x27;&#x27;);%20const%20publisherFromText%20=%20(el)%20=&gt;%20{%20const%20match%20=%20text(el.querySelector(&#x27;p&#x27;)).match(/%E5%87%BA%E7%89%88%E7%A4%BE[:%EF%BC%9A]%5Cs*(.+?)%5Cs*(%E6%9F%A5%E7%9C%8B%E9%9B%BB%E5%AD%90%E6%9B%B8|$)/);%20return%20match%20?%20match[1]%20:%20&#x27;&#x27;;%20};%20const%20items%20=%20[];%20let%20intro%20=%20&#x27;&#x27;;%20let%20pending%20=%20null;%20document.querySelectorAll(&#x27;.content-block,%20.book-block&#x27;).forEach((el)%20=&gt;%20{%20if%20(el.classList.contains(&#x27;content-block&#x27;))%20{%20const%20heading%20=%20text(el.querySelector(&#x27;h3&#x27;));%20if%20(!heading)%20{%20intro%20=%20intro%20||%20text(el);%20return;%20}%20pending%20=%20{%20heading,%20description:%20text(el.querySelector(&#x27;p&#x27;))%20};%20return;%20}%20items.push({%20heading:%20pending%20?%20pending.heading%20:%20&#x27;&#x27;,%20description:%20pending%20?%20pending.description%20:%20&#x27;&#x27;,%20title:%20text(el.querySelector(&#x27;.title&#x27;)),%20author:%20text(el.querySelector(&#x27;.author&#x27;)),%20publisher:%20text(el.querySelector(&#x27;a[href*=%22Imprint%22]&#x27;))%20||%20publisherFromText(el),%20kobo_url:%20(el.querySelector(&#x27;.book-block__link&#x27;)%20||%20{}).href%20||%20&#x27;&#x27;,%20cover_url:%20(el.querySelector(&#x27;img&#x27;)%20||%20{}).src%20||%20&#x27;&#x27;,%20});%20pending%20=%20null;%20});%20if%20(!/%5C/blog%5C/weekly-(dd99|8585)-/.test(location.pathname)%20||%20!items.length)%20{%20alert(&#x27;%E6%89%BE%E4%B8%8D%E5%88%B0%E6%9B%B8%E5%96%AE%EF%BC%9A%E8%AB%8B%E5%9C%A8%20Kobo%20blog%20%E7%9A%84%E3%80%8C%E4%B8%80%E9%80%B199%E6%9B%B8%E5%96%AE%E3%80%8D%E6%88%96%E3%80%8C%E6%9C%AC%E9%80%B1%E7%B2%BE%E9%81%B8%E6%9B%B8%E5%96%AE%E3%80%8D%E6%96%87%E7%AB%A0%E9%A0%81%E4%BD%BF%E7%94%A8%E3%80%82&#x27;);%20return;%20}%20const%20slug%20=%20location.pathname.split(&#x27;/&#x27;).filter(Boolean).pop();%20const%20json%20=%20JSON.stringify({%20source:%20&#x27;kobo-blog-bookmarklet&#x27;,%20version:%201,%20url:%20location.origin%20+%20location.pathname,%20title:%20text(document.querySelector(&#x27;h1&#x27;)),%20intro,%20items,%20});%20const%20link%20=%20document.createElement(&#x27;a&#x27;);%20link.href%20=%20URL.createObjectURL(new%20Blob([json],%20{%20type:%20&#x27;application/json&#x27;%20}));%20link.download%20=%20slug%20+%20&#x27;.json&#x27;;%20document.body.appendChild(link);%20link.click();%20link.remove();%20alert(&#x27;%E5%B7%B2%E4%B8%8B%E8%BC%89%20&#x27;%20+%20slug%20+%20&#x27;.json%EF%BC%88&#x27;%20+%20items.length%20+%20&#x27;%20%E6%9C%AC%E6%9B%B8%EF%BC%89%E3%80%82%5Cn%E8%AB%8B%E5%9F%B7%E8%A1%8C%EF%BC%9A~/workspace/kobo99/scripts/update.sh&#x27;);%20})();">📚 擷取 Kobo 書單</a></p>
<ol>
<li>按 <code>⌘⇧B</code> 顯示書籤列，把上面的按鈕拖到書籤列。</li>
<li>每週四開「一週99書單」、每週一開「本週精選書單」文章，點書籤，會下載 <code>weekly-*.json</code>。</li>
<li>執行 <code>~/workspace/kobo99/scripts/update.sh</code>，會發佈到 GitHub Pages。</li>
</ol>
<p class="meta">若 Brave 詢問是否允許下載，請選允許。</p>
